name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21.x', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Verify modules
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Vet
        run: go vet ./...
